name: nexus_home_app
description: "NexusHome - Smart Home IoT Ecosystem & Matter/Thread Mesh Network Controller"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  get_it: ^8.0.3
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  path: ^1.9.0
  dio: ^5.7.0
  fl_chart: ^0.70.2
  connectivity_plus: ^6.1.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
